<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGM-H | Acceso al Sistema</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@400;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="login-container">
        <h1>DEPARTAMENTO DE INGENIERÍA BIOMÉDICA</h1>
        <p class="acceso-restringido">ACCESO RESTRINGIDO</p>
        
        <form id="loginForm">
            <input type="email" id="email" placeholder="Correo Electrónico" autocomplete="username">
            <input type="password" id="password" placeholder="Contraseña" autocomplete="current-password">
            <button id="loginBtn" type="submit">Ingresar</button>
        </form>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
