<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGM-H | Tablero y Registro</title>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="dashboard-wrapper">
        <aside class="sidebar">
            <h2>SGM-H</h2>
            <nav>
                <ul>
                    <li><a href="dashboard.html" class="active"> Tablero</a></li>
                    <li><a href="gestion.html"> Gestión de Órdenes</a></li>
                    <li><a href="reportes.html"> Descargar por Fechas</a></li>
                </ul>
            </nav>
            <button class="logout-btn" onclick="cerrarSesion()" style="margin-top: 20px; width: 100%; cursor: pointer;">Cerrar Sesión</button>
        </aside>

        <main class="content">
            <div class="form-container">
                <h1>REGISTRO DE ORDEN DE SERVICIO</h1>

                <div class="modulo">
                    <h2>Información Automática</h2>
                    <div class="grid-container">
                        <input type="text" id="folio" value="IBM-" placeholder="IBMD0000" autofocus>
                        <input type="text" id="fecha" readonly>
                        <input type="text" id="hora" readonly>
                    </div>
                </div>

                <div class="modulo">
                    <h2>Datos de la Solicitud</h2>
                    <div class="grid-container">
                        <input list="lista_solicitantes" id="solicitante_nombre" placeholder="Nombre del Solicitante">
                        <datalist id="lista_solicitantes">
                            <option value="Maritza Paola Reyes Anguiano">
                            <option value="María Isabel Flores Dorado">
                            <option value="Ma. Evangelina García Franco">
                            <option value="Maritza Paola Reyes Anguiano">
                            <option value="Mónica Martínez Topete">
                            <option value="Laura Angélica Calzada Chaves">
                            <option value="Diana Yadira Caudillo Ramos">
                            <option value="Blanca Esthela Esparza Llamas">
                            <option value="Dr. David Mendoza Alvarado">
                            <option value="No aplica">
                        </datalist>

                        <select id="area">
                            <option value="urgencias_adultos">Urgencias Adultos</option>
                            <option value="urgencias_pediatricas">Urgencias Pediátricas</option>
                            <option value="medicina_interna">Medicina Interna</option>
                            <option value="cirugia">Cirugía</option>
                            <option value="quirofano">Quirófano</option>
                            <option value="ceye">CEyE</option>
                            <option value="terapia_adultos">Terapia Adultos</option>
                            <option value="ucip">UCIP</option>
                            <option value="pediatria">Pediatría</option>
                            <option value="traumatologia">Traumatología</option>
                            <option value="rehabilitacion">Rehabilitación</option>
                            <option value="imagenologia">Imagenología</option>
                            <option value="laboratorio">Laboratorio</option>
                            <option value="consulta_externa">Consulta Externa</option>
                            <option value="hospitalizacion">Hospitalización</option>
                            <option value="departamento_biomedico">Departamento Biomédico</option>
                        </select>

                        <textarea id="descripcion_problema" class="full-width" placeholder="Descripción del Trabajo Requerido"></textarea>
                        <textarea id="trabajo_realizado" class="full-width" placeholder="Descripción del Trabajo Realizado"></textarea>
                        <textarea id="refacciones_usadas" class="full-width" placeholder="Refacciones, Accesorios y/o Químicos Utilizados"></textarea>
                        <textarea id="observaciones_inf" class="full-width" placeholder="Observaciones"></textarea>
                    </div>
                </div>

                <div class="modulo">
                    <h2>Estado y Mantenimiento</h2>
                    <div class="grid-container">
                        <div>
                            <label>Estado del Equipo (Antes del Mantenimiento):</label>
                            <div class="radio-group">
                                <input type="radio" name="estado_antes" value="funcionamiento"> Funcionamiento
                                <input type="radio" name="estado_antes" value="fuera_servicio"> Fuera de Servicio
                                <input type="radio" name="estado_antes" value="NA"> No Aplica 
                            </div>
                        </div>
                        
                        <div>
                            <label>Tipo de Mantenimiento:</label>
                            <div class="radio-group">
                                <input type="radio" name="tipo_mtt" value="MP"> MP
                                <input type="radio" name="tipo_mtt" value="MC"> MC
                                <input type="radio" name="tipo_mtt" value="MC_MP"> MC/MP
                                <input type="radio" name="tipo_mtt" value="NA"> No Aplica
                            </div>
                        </div>
                    </div>
                </div>

                <div class="modulo">
                    <h2>Firmas y Responsables</h2>
                    <div class="grid-container">
                        <div class="field-wrapper">
                            <label>Recibe Orden de Trabajo:</label>
                            <input type="text" id="recibe_orden" value="Ing. Alejandra Guadalupe Ibarra Palomino">
                        </div>
                        <div class="field-wrapper">
                            <label>Jefe de Taller:</label>
                            <input type="text" id="jefe_taller" value="Ing. Alejandra Guadalupe Ibarra Palomino">
                        </div>
                        <div class="field-wrapper">
                            <label>Realiza el Trabajo:</label>
                            <input type="text" id="realiza_trabajo" placeholder="Nombre técnico">
                        </div>
                        <div class="field-wrapper">
                            <label>Recibe Trabajo:</label>
                            <input type="text" id="recibe_trabajo" placeholder="Nombre de quien recibe">
                        </div>
                    </div>
                </div>

                <button id="guardarBtn" class="full-width">Guardar en Base de Datos</button>
                <button id="wordBtn" type="button" class="full-width" style="background-color: #2b579a; color: white; margin-top: 8px;">Descargar Word</button>
                <button id="pdfBtn" type="button" class="full-width" style="background-color: #2c83bc; color: white; margin-top: 8px;">Generar y Descargar PDF</button>
                <button id="limpiarBtn" type="button" style="background-color: #e03538; color: white; width: 100%; margin-top: 8px;">Limpiar Formulario</button>
            </div>
        </main> 
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
